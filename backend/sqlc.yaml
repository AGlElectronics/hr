version: "2"
# NOTE for this scaffold phase: queries/ holds hand-written SQL for sqlc to
# generate from in a later phase. The HTTP/service stubs currently talk to
# pgx directly so the module compiles with no code-generation step. When
# we flip services to the generated repository, add `sqlc generate` to the
# Dockerfile and tooling targets (see stash/infra/Dockerfile.backend for a
# reference implementation).
sql:
  - engine: "postgresql"
    queries: "queries"
    schema: "migrations"
    gen:
      go:
        package: "sqlcgen"
        out: "internal/repository/sqlcgen"
        sql_package: "pgx/v5"
        emit_json_tags: true
        emit_pointers_for_null_types: true
        emit_prepared_queries: false
        emit_interface: true
        emit_exact_table_names: false
        emit_empty_slices: true
        overrides:
          - db_type: "uuid"
            go_type: "github.com/google/uuid.UUID"
          - db_type: "uuid"
            nullable: true
            go_type:
              import: "github.com/google/uuid"
              type: "UUID"
              pointer: true
