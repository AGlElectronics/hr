upstream hr_backend {
    # Container-internal port is :8080 for every module in this ecosystem.
    # Host-side mapping (host:8110 -> container:8080) lives in docker-compose.yml.
    server backend:8080;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 10m;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    gzip_min_length 1024;

    # API reverse proxy — the SPA calls /api/... relative so the same origin
    # serves both static assets and the API; avoids CORS in production.
    location /api/ {
        proxy_pass http://hr_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Request-ID $request_id;
        proxy_pass_request_headers on;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_buffering off;
    }

    # Liveness / readiness pass through so orchestrator probes can target the
    # frontend origin and still reach the backend.
    location = /livez {
        proxy_pass http://hr_backend/livez;
    }
    location = /readyz {
        proxy_pass http://hr_backend/readyz;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;
    }
}
