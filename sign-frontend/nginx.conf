# Volunteer signing UI. Re-resolve hr-backend through Docker DNS: a cached
# IP goes stale when the backend container is recreated (same pattern as
# hr/infra/nginx.stack.conf).
resolver 127.0.0.11 valid=10s ipv6=off;

upstream hr_backend {
    zone hr_backend 64k;
    server hr-backend:8080 resolve;
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    absolute_redirect off;

    location /api/ {
        proxy_pass http://hr_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_pass_request_headers on;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_buffering off;
    }

    location /s/ {
        try_files /index.html =404;
    }

    location = / {
        return 302 /s/;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
